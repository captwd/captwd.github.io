<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg">
  <!-- tree -->
  <rect x="20" y="20" width="380" height="370" rx="10" fill="#fff" stroke="#1e7a55" stroke-width="2"/>
  <text x="210" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#14573c">MatchaTTS（模块树）</text>
  <g font-size="12.5">
    <rect x="45" y="66" width="150" height="30" rx="6" fill="#1e7a55"/><text x="120" y="85" text-anchor="middle" fill="#fff">MatchaTTS</text>
    <rect x="60" y="116" width="160" height="26" rx="6" fill="#e8f4ee" stroke="#1e7a55"/><text x="140" y="133" text-anchor="middle">encoder (TextEncoder)</text>
    <rect x="60" y="152" width="160" height="26" rx="6" fill="#e8f4ee" stroke="#1e7a55"/><text x="140" y="169" text-anchor="middle">decoder (CFM)</text>
    <rect x="60" y="196" width="120" height="24" rx="6" fill="#f7faf8" stroke="#999"/><text x="120" y="212" text-anchor="middle" fill="#666">mel_mean/std (buffer)</text>
    <rect x="100" y="240" width="170" height="26" rx="6" fill="#e8f4ee" stroke="#1e7a55"/><text x="185" y="257" text-anchor="middle">estimator (Decoder)</text>
    <rect x="130" y="286" width="190" height="26" rx="6" fill="#fdf3e7" stroke="#b7791f"/><text x="225" y="303" text-anchor="middle">down_blocks.0.0 (ConvNeXt块)</text>
    <rect x="160" y="330" width="200" height="26" rx="6" fill="#fff" stroke="#b7791f"/><text x="260" y="347" text-anchor="middle">block1.dwconv.weight (Parameter)</text>
  </g>
  <g stroke="#1e7a55" stroke-width="1.5" fill="none">
    <line x1="120" y1="96" x2="120" y2="116"/><line x1="140" y1="142" x2="140" y2="152"/>
    <line x1="130" y1="178" x2="130" y2="196"/><line x1="170" y1="178" x2="185" y2="240"/>
    <line x1="200" y1="266" x2="215" y2="286"/><line x1="235" y1="312" x2="250" y2="330"/>
  </g>

  <!-- flatten arrow -->
  <line x1="410" y1="200" x2="480" y2="200" stroke="#1e7a55" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="445" y="188" text-anchor="middle" font-size="12" fill="#666">state_dict()</text>
  <text x="445" y="216" text-anchor="middle" font-size="11" fill="#666">深度优先摊平</text>

  <!-- flat dict -->
  <rect x="488" y="20" width="432" height="370" rx="10" fill="#f7faf8" stroke="#2563ab" stroke-width="2"/>
  <text x="704" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563ab">OrderedDict（门牌号 → 张量）</text>
  <g font-size="11.5" font-family="Consolas,monospace">
    <text x="505" y="74" fill="#14573c">"encoder.emb.weight"                        → [512,178]</text>
    <text x="505" y="98" fill="#14573c">"encoder.encoder.attn_layers.0.conv_q.weight" → [512,512]</text>
    <text x="505" y="122" fill="#b7791f">"decoder.estimator.down_blocks.0.0.</text>
    <text x="521" y="142" fill="#b7791f">block1.dwconv.weight"            → [256,1,7]</text>
    <text x="521" y="162" fill="#b7791f">block1.norm.weight"              → [256]</text>
    <text x="521" y="182" fill="#b7791f">grn.gamma / grn.beta"            → [1,1,1024]</text>
    <text x="505" y="206" fill="#14573c">"decoder.estimator.mid_blocks.0.0.res_conv.weight"</text>
    <text x="505" y="230" fill="#14573c">"mel_mean"  → scalar   (buffer，不训练)</text>
    <text x="505" y="254" fill="#14573c">"mel_std"   → scalar   (buffer，不训练)</text>
  </g>
  <text x="704" y="292" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="bold">加载 = 按门牌号 copy_() 逐个搬入</text>
  <text x="704" y="314" text-anchor="middle" font-size="12" fill="#666">换骨干 → 门牌号对不上 → missing/unexpected keys</text>
  <text x="704" y="336" text-anchor="middle" font-size="12" fill="#666">架构（resnet_type 等）不在 state_dict 里，</text>
  <text x="704" y="356" text-anchor="middle" font-size="12" fill="#666">而在 checkpoint 的 hyper_parameters 中（图纸 vs 家具）</text>
</svg>
