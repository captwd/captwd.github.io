<svg viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="30" width="900" height="260" rx="12" fill="#f7faf8" stroke="#1e7a55" stroke-width="2"/>
  <text x="470" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#14573c">一个 CPU 核心的解剖（流水线五段）</text>
  <g font-size="12">
    <rect x="50" y="80" width="130" height="50" rx="8" fill="#1e7a55"/><text x="115" y="110" text-anchor="middle" fill="#fff">取指 Fetch</text>
    <rect x="220" y="80" width="130" height="50" rx="8" fill="#2c8f66"/><text x="285" y="110" text-anchor="middle" fill="#fff">解码 Decode</text>
    <rect x="390" y="80" width="150" height="50" rx="8" fill="#b7791f"/><text x="465" y="110" text-anchor="middle" fill="#fff">乱序调度 OoO</text>
    <rect x="580" y="80" width="130" height="50" rx="8" fill="#2563ab"/><text x="645" y="110" text-anchor="middle" fill="#fff">执行 ALU/SIMD</text>
    <rect x="750" y="80" width="130" height="50" rx="8" fill="#64748b"/><text x="815" y="110" text-anchor="middle" fill="#fff">写回 Retire</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar2)">
    <line x1="180" y1="105" x2="217" y2="105"/><line x1="350" y1="105" x2="387" y2="105"/>
    <line x1="540" y1="105" x2="577" y2="105"/><line x1="710" y1="105" x2="747" y2="105"/>
  </g>
  <!-- caches -->
  <g font-size="11.5">
    <rect x="120" y="170" width="200" height="40" rx="8" fill="#e8f4ee" stroke="#1e7a55"/><text x="220" y="195" text-anchor="middle">L1：32KB 指令 + 32KB 数据（每核私有，~4 周期）</text>
    <rect x="360" y="170" width="200" height="40" rx="8" fill="#e8f4ee" stroke="#1e7a55"/><text x="460" y="195" text-anchor="middle">L2：~1MB（每核私有，~12 周期）</text>
    <rect x="600" y="170" width="290" height="40" rx="8" fill="#e8f4ee" stroke="#1e7a55"/><text x="745" y="195" text-anchor="middle">L3：几十 MB（全核共享，~40 周期）</text>
    <text x="470" y="245" text-anchor="middle" fill="#666">缓存行（cache line）= 64B：数据按 64 字节整块搬运 —— "顺序访问快、跳跃访问慢"的物理根源</text>
    <text x="470" y="270" text-anchor="middle" fill="#c0392b">内存墙：L1 之后每一层都慢一个数量级，CPU 设计的全部魔法都在"预测并提前把数据搬到楼上"</text>
  </g>
</svg>
