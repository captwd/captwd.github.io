<svg viewBox="0 0 940 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7a55"/>
    </marker>
  </defs>
  <g font-size="13">
    <rect x="20"  y="40" width="180" height="60" rx="8" fill="#f7faf8" stroke="#64748b"/><text x="110" y="65" text-anchor="middle" fill="#475569" font-weight="bold">磁盘 2%</text><text x="110" y="85" text-anchor="middle" font-size="11" fill="#666">已退休（页缓存接管）</text>
    <rect x="240" y="40" width="180" height="60" rx="8" fill="#f7faf8" stroke="#64748b"/><text x="330" y="65" text-anchor="middle" fill="#475569" font-weight="bold">内存 85%</text><text x="330" y="85" text-anchor="middle" font-size="11" fill="#666">够用但贴警戒线</text>
    <rect x="460" y="40" width="180" height="60" rx="8" fill="#e8f4ee" stroke="#1e7a55"/><text x="550" y="65" text-anchor="middle" fill="#14573c" font-weight="bold">CPU 33%</text><text x="550" y="85" text-anchor="middle" font-size="11" fill="#666">指挥 + 喂食</text>
    <rect x="680" y="40" width="180" height="60" rx="8" fill="#1e7a55"/><text x="770" y="65" text-anchor="middle" fill="#fff" font-weight="bold">GPU 46%</text><text x="770" y="85" text-anchor="middle" font-size="11" fill="#d8ede4">等喂数据</text>
  </g>
  <g stroke="#1e7a55" stroke-width="2" fill="none" marker-end="url(#ar3)">
    <line x1="200" y1="70" x2="237" y2="70" stroke="#64748b"/>
    <line x1="420" y1="70" x2="457" y2="70"/>
    <line x1="640" y1="70" x2="677" y2="70"/>
  </g>
  <text x="470" y="130" text-anchor="middle" font-size="12.5" fill="#666">串行链：数据 → 批组装 → kernel 发射 → 计算。链上每一环都半闲 = 瓶颈是"链路延迟"而非"某环节算力"</text>
</svg>
