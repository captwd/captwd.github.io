<svg viewBox="0 0 940 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="40" width="420" height="220" rx="10" fill="#f7faf8" stroke="#1e7a55"/>
  <text x="240" y="66" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14573c">CPU：4 个教授</text>
  <g font-size="11.5" fill="#666">
    <text x="50" y="94">· 少量超强核心：乱序执行、分支预测、超大缓存</text>
    <text x="50" y="116">· 目标：让"单个任务的延迟"尽可能小</text>
    <text x="50" y="138">· 擅长：复杂逻辑、分支、串行依赖</text>
    <text x="50" y="160">· 弱点：并行任务多时，每个任务的启动开销高</text>
    <rect x="50" y="180" width="180" height="30" fill="#e8f4ee" stroke="#1e7a55"/><text x="140" y="200" text-anchor="middle" font-size="11">延迟优化（Low Latency）</text>
    <rect x="240" y="180" width="180" height="30" fill="#e8f4ee" stroke="#1e7a55"/><text x="330" y="200" text-anchor="middle" font-size="11">缓存大量数据就地算</text>
  </g>
  <rect x="490" y="40" width="420" height="220" rx="10" fill="#e8f4ee" stroke="#2563ab"/>
  <text x="700" y="66" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563ab">GPU：一个礼堂的学生</text>
  <g font-size="11.5" fill="#666">
    <text x="510" y="94">· 几千个简单核心：同时做一模一样的简单算术</text>
    <text x="510" y="116">· 目标：让"总吞吐量"尽可能大，单步延迟无所谓</text>
    <text x="510" y="138">· 擅长：海量同构小计算（矩阵乘法！）</text>
    <text x="510" y="160">· 弱点：分支多、逻辑复杂的任务（发散即空转）</text>
    <rect x="510" y="180" width="180" height="30" fill="#fff" stroke="#2563ab"/><text x="600" y="200" text-anchor="middle" font-size="11">吞吐优化（Throughput）</text>
    <rect x="700" y="180" width="180" height="30" fill="#fff" stroke="#2563ab"/><text x="790" y="200" text-anchor="middle" font-size="11">靠并行度填满流水线</text>
  </g>
</svg>
